[project]
name = "derive"
version = "0.2.0"
description = "A powerful symbolic mathematics library for Python"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Brandon DiNunno" },
    { name = "Tom Mainiero" },
]
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.13",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "polars>=0.20",
    "pytest>=8.0",
    "mpmath>=1.3",
    "rich>=13.0",
    "nbconvert>=7.16.6",
    "ipykernel>=7.1.0",
]

[project.optional-dependencies]
notebooks = [
    "marimo>=0.8",
]
optimize = [
    "cvxpy>=1.4",
]
regression = [
    "pysr>=0.19",
]
dev = [
    "pytest-cov>=4.1",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "marimo>=0.8",
    "cvxpy>=1.4",
]
all = [
    "marimo>=0.8",
    "cvxpy>=1.4",
    "pysr>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
